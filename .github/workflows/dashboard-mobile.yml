name: Dashboard mobile browser regression

on:
  push:
    paths:
      - "radar/templates/birlesik.html"
      - "tests/dashboard_mobile.cjs"
      - ".github/workflows/dashboard-mobile.yml"
  pull_request:
    paths:
      - "radar/templates/birlesik.html"
      - "tests/dashboard_mobile.cjs"
      - ".github/workflows/dashboard-mobile.yml"

permissions:
  contents: read

jobs:
  mobile-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: npm install --no-save --no-package-lock playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test phone viewport layouts and dashboard tabs
        run: node tests/dashboard_mobile.cjs
