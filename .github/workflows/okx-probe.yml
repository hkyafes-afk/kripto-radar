name: OKX copy-trading probe

# Tek seferlik, elle tetiklenir. Kimlik doğrulamasız halka açık uç noktaları test eder.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Probe
        run: python scripts/okx_copytrade_probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: okx-probe
          path: okx_probe_report.json
