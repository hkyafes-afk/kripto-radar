name: Veri toplayıcı

# v9 Faz 0: Balina Gözü'nün hafızası. Borsalar açık pozisyon, long/short oranı ve likidasyon geçmişini kısa tuttuğu
# için her saat kaydedip `veri` dalında biriktiriyoruz. Canlı döngüden ayrı çalışır; ajanların hızını etkilemez.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: veri
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: veri dalını hazırla
        run: |
          git config --global user.name "kripto-radar"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch -q origin veri:veri 2>/dev/null; then
            git worktree add -q veri veri
          else
            git worktree add -q --detach veri
            cd veri && git checkout -q --orphan veri && git rm -rqf . && \
              printf '# Kripto Radar veri arşivi\n\nSaatlik OKX kayıtları (OI, long/short, taker, likidasyon). Kaynak: radar/collect.py\n' > README.md
          fi
      - name: Topla
        run: python -m radar veri --out veri/okx --coins 40
      - name: Kaydet
        run: |
          cd veri
          git add -A
          git commit -qm "📊 veri $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          for i in 1 2 3; do
            git push -q origin veri && break
            git pull -q --rebase origin veri || true
            sleep 3
          done
