name: OKX public contract audit

on:
  workflow_dispatch:
  push:
    branches: [feat/autonomous-trader-core]
    paths:
      - "tools/okx_contract_audit.py"
      - "tests/test_okx_contract_audit.py"
      - ".github/workflows/okx-contract-audit.yml"

permissions:
  contents: read

jobs:
  public-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/autonomous-trader-core
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python -m pip install pytest
      - name: Run deterministic tests
        run: python -m pytest -q tests/test_okx_contract_audit.py
      - name: Query public OKX instruments and tickers
        run: python tools/okx_contract_audit.py
      - name: Upload timestamped audit
        uses: actions/upload-artifact@v6
        with:
          name: okx-contract-audit-${{ github.run_id }}
          path: |
            data/OKX_100USDT_KONTRAT_DENETIMI.md
            data/okx_contract_audit.json
          retention-days: 30
