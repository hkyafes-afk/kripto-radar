name: Varyant yarışı

# v9 Faz 1: her yöneticinin mevcut kuralı tek değişiklikli varyantlarına karşı 5 yıllık veride, sert maliyetle yarışır.
# Sonuç data/race.json + data/YARIS.md. Kazananlar config.yaml → ekip.varyant'a ELLE (gözden geçirilerek) yazılır.
on:
  workflow_dispatch:
    inputs:
      years:
        description: "Kaç yıl"
        default: "5"
      coins:
        description: "Kaç coin"
        default: "30"

permissions:
  contents: write

concurrency:
  group: yaris
  cancel-in-progress: false

jobs:
  race:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Yarış
        run: python -m radar yaris --coins ${{ github.event.inputs.coins || '30' }} --years ${{ github.event.inputs.years || '5' }}
      - name: Sonucu kaydet
        run: |
          git config user.name "kripto-radar"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/race.json data/YARIS.md data/race_islemler.csv
          python -m radar etkinlik --yaris data/race_islemler.csv --cikti data/etkinlik_yaris.json && git add data/etkinlik_yaris.json || true
          if ! git diff --cached --quiet; then
            git commit -qm "🏁 varyant yarışı"
            for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
          fi
