name: Canlı döngü

# Sürekli açık kalan tarama + demo hesap. Tek çalışma ~5,5 saat sürer.
# Saatlik tetik, çalışan döngü varken sıraya girer ve o bitince hemen devralır
# (aynı anda en fazla 1 çalışan + 1 bekleyen; fazlası GitHub tarafından iptal edilir, bu normaldir).
on:
  schedule:
    - cron: "4 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Kütüphaneleri kur
        run: pip install -r requirements.txt

      - name: Önceki durumu al (demo hesap, ayarlar, dashboard)
        run: bash scripts/site.sh pull

      - name: Canlı döngü
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m radar live --site site

      - name: Son durumu yayınla
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/site.sh push "döngü sonu"

      - name: Haftalık karneyi kaydet
        if: always()
        run: |
          if [ -f data/KARNE.md ]; then
            git config user.name "kripto-radar"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/KARNE.md
            if ! git diff --cached --quiet; then
              git commit -qm "📒 haftalık karne"
              git pull -q --rebase && git push -q
            fi
          fi
