name: Canlı döngü

# Best-effort uzun koşu + lease devri. GitHub-hosted runner kalıcı sunucu değildir.
# 355 dk timeout, runner/kota/iptal/devir boşlukları nedeniyle 7/24 veya düşük gecikme garantisi YOKTUR.
# 15 dk cron yalnızca bekçi tetiktir; Actions zamanlayıcısı gecikebilir ve sürekli çalışma SLA'sı değildir.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      devir:
        description: "Önceki döngüden devir (otomatik)"
        default: "0"

permissions:
  contents: write
  actions: write

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v5

      - name: Nöbet kontrolü
        id: nobet
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEVIR: ${{ github.event.inputs.devir || '0' }}
        run: |
          d=$(mktemp -d)
          if git clone -q --depth 1 --branch kalp "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$d" 2>/dev/null && [ -f "$d/lease.json" ]; then
            live=$(python3 -c "import json,time;l=json.load(open('$d/lease.json'));print(1 if (not l.get('released') and time.time()-l.get('hb',0)/1000<180) else 0)")
          else
            live=0
          fi
          echo "Nöbette sağlıklı döngü: $live, devir: $DEVIR"
          echo "START_TS=$(date +%s)" >> "$GITHUB_ENV"
          if [ "$live" = "1" ] && [ "$DEVIR" != "1" ]; then echo "calis=0" >> "$GITHUB_OUTPUT"; else echo "calis=1" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-python@v6
        if: steps.nobet.outputs.calis == '1'
        with:
          python-version: "3.12"
          cache: pip

      - name: Kütüphaneleri kur
        if: steps.nobet.outputs.calis == '1'
        run: pip install -r requirements.txt -r polat/requirements.txt

      - name: Önceki durumu al (dashboard)
        if: steps.nobet.outputs.calis == '1'
        run: bash scripts/site.sh pull

      - name: Canlı döngü
        if: steps.nobet.outputs.calis == '1'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          GITHUB_TOKEN: ${{ github.token }}
          DEVIR: ${{ github.event.inputs.devir || '0' }}
          UNIFIED_POLAT_BRIDGE_PATH: ${{ runner.temp }}/polat-unified-bridge.json
          UNIFIED_POLAT_BRIDGE_HMAC_KEY: ${{ secrets.POLAT_UNIFIED_BRIDGE_HMAC_KEY }}
        run: |
          set -euo pipefail
          python scripts/polat_bridge_sync.py pull-loop --path "$UNIFIED_POLAT_BRIDGE_PATH" --interval 5 > "$RUNNER_TEMP/polat-bridge-pull.log" 2>&1 &
          RELAY_PID=$!
          cleanup_relay() {
            kill "$RELAY_PID" 2>/dev/null || true
            wait "$RELAY_PID" 2>/dev/null || true
          }
          trap cleanup_relay EXIT
          ready=0
          for i in $(seq 1 120); do
            if [ -s "$UNIFIED_POLAT_BRIDGE_PATH" ] && python -c 'import os,time; from radar.unified.polat_bridge import read_snapshot; p=os.environ["UNIFIED_POLAT_BRIDGE_PATH"]; k=os.environ.get("UNIFIED_POLAT_BRIDGE_HMAC_KEY") or None; r=read_snapshot(p,now_ms=int(time.time()*1000),max_age_ms=45000,hmac_key=k,require_hmac=bool(k)); raise SystemExit(0 if r.status=="fresh" else 1)'; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            cat "$RUNNER_TEMP/polat-bridge-pull.log"
            echo "::error::No fresh Polat cross-runner research snapshot; UnifiedTrader remains fail-closed."
            exit 1
          fi
          echo "Fresh Polat research snapshot received from the dedicated GitHub bridge branch."
          python -m radar live --site site

      - name: Son durumu yayınla
        if: always() && steps.nobet.outputs.calis == '1'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f site/.nobet_yok ]; then echo "Nöbet alınmadı, yayın atlandı."; exit 0; fi
          bash scripts/site.sh push "döngü sonu"

      # Süreç sert çökerse (bellek, sinyal vb.) Python'un kendi kurtarması çalışamaz; zinciri burası sürdürür.
      # Halef nabız 3 dk eskiyince en son yedekle devralır. Açılışta çökme döngüsüne girmemek için ≥10 dk çalışmış olmalı.
      - name: Çökme kurtarma
        if: failure() && steps.nobet.outputs.calis == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f .halef_gonderildi ] || [ -f site/.nobet_yok ]; then echo "Halef zaten çağrıldı / nöbet bizde değil."; exit 0; fi
          ran=$(( $(date +%s) - ${START_TS:-$(date +%s)} ))
          if [ "$ran" -lt 600 ]; then echo "::warning::Döngü ${ran} sn içinde çöktü; döngüsel çökmeye karşı yeniden başlatma bekçiye bırakıldı."; exit 0; fi
          gh workflow run canli.yml -R "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f devir=1
          echo "::notice::Döngü çöktü (${ran} sn sonra); yeni döngü başlatıldı."

      - name: Haftalık karneyi kaydet
        if: always() && steps.nobet.outputs.calis == '1'
        run: |
          if [ -f data/KARNE.md ]; then
            git config user.name "kripto-radar"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/KARNE.md
            if ! git diff --cached --quiet; then
              git commit -qm "📒 haftalık karne"
              git pull -q --rebase && git push -q
            fi
          fi
