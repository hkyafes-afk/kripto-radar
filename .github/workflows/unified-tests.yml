name: Unified trader tests

on:
  push:
    branches:
      - "feat/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unified-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Run unified trader and shared policy tests
        run: >-
          python -m pytest -q
          tests/test_unified_*.py
          tests/test_golge_portfoy.py
          tests/test_yetki_operasyonel.py
          tests/test_policy.py
          tests/test_okx_contract_audit.py
          tests/test_unified_authority.py
