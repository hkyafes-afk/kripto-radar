name: Teşhis
on: workflow_dispatch
permissions:
  pages: write
  contents: read
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          r=$(curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages -d '{"source":{"branch":"gh-pages","path":"/"}}')
          echo "::notice title=pages-create::$(echo "$r" | tr '\n' ' ' | cut -c1-600)"
          r=$(curl -s -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/${{ github.repository }}/pages)
          echo "::notice title=pages-get::$(echo "$r" | tr '\n' ' ' | cut -c1-600)"
