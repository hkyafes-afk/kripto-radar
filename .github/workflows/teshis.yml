name: Teşhis (salt okunur)

# Kaan ve Deniz neden işlem açmıyor? OKX public mumlarını okur, raporu iş özetine yazar. Hiçbir dosyayı değiştirmez.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  teshis:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python tools/teshis.py
