name: Analist-Hakem

# v9 üç katmanlı öğrenmenin günlük katmanı: "bu sinyal tutar mı?" modeli her gece 5 yıllık test işlemleri +
# canlı ve gölge kapanmış işlemlerle yeniden eğitilir. Doğrulamada kendini kanıtlamazsa boyuta dokunmaz.
# Sonuç data/hakem.json → canlı motor saatte bir okur.
on:
  schedule:
    - cron: "23 1 * * *"     # her gece 04:23 (İstanbul)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hakem
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Canlı defteri al
        run: |
          git clone -q --depth 1 --branch kalp "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" kalp || true
      - name: Eğit
        run: python -m radar hakem --coins 30 --years 5 $( [ -f kalp/ledger.json ] && echo --ledger kalp/ledger.json )
      - name: Sonucu kaydet
        run: |
          rm -rf kalp
          git config user.name "kripto-radar"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/hakem.json data/HAKEM.md
          if ! git diff --cached --quiet; then
            git commit -qm "🧑‍⚖️ Analist-Hakem modeli"
            for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
          fi
