name: OKX depth probe

# Tek seferlik, elle tetiklenir. Kimlik doğrulamasız halka açık uç noktaları test eder.
# Rapor (trader kimliği yok, yalnızca durum ve alan adları) okx-depth-veri dalına yazılır.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Probe
        run: python scripts/okx_depth_probe.py
      - name: Raporu dala yaz
        run: |
          git config user.name "okx-depth"
          git config user.email "okx-probe@users.noreply.github.com"
          git fetch -q origin okx-depth-veri 2>/dev/null && git checkout -q -B okx-depth-veri origin/okx-depth-veri || git checkout -q --orphan okx-depth-veri
          cp okx_depth_report.json derinlik.json
          git add derinlik.json && git commit -q -m "probe raporu ${GITHUB_RUN_ID}" || true
          git push -q origin HEAD:okx-depth-veri
