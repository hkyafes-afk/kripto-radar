name: Backtest

on:
  schedule:
    - cron: "17 3 * * 0"     # her pazar 06:17 (İstanbul)
  workflow_dispatch:
    inputs:
      surum:
        description: "v8 = yöneticilerin 5 yıllık testi, v7 = eski sinyal testi"
        default: "v8"
      years:
        description: "v8: kaç yıl"
        default: "5"
      mod:
        description: "standart | kesintisiz"
        default: "standart"
      coins:
        description: "Kaç coin (hacme göre)"
        default: "30"
      days:
        description: "Kaç günlük veri"
        default: "365"

permissions:
  contents: write

concurrency:
  group: backtest
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: v8 yönetici testi (5 yıl, sert maliyet)
        if: (github.event.inputs.surum || 'v8') == 'v8'
        run: python -m radar test8 --coins "${{ github.event.inputs.coins || '30' }}" --years "${{ github.event.inputs.years || '5' }}" ${{ github.event.inputs.mod == 'kesintisiz' && '--kesintisiz' || '' }}
      - name: Walk-forward backtest (v7)
        if: (github.event.inputs.surum || 'v8') == 'v7'
        run: python -m radar backtest --coins "${{ github.event.inputs.coins || '30' }}" --days "${{ github.event.inputs.days || '365' }}"
      - name: Sonucu kaydet
        run: |
          git config user.name "kripto-radar"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/
          if ! git diff --cached --quiet; then
            git commit -qm "📈 backtest sonucu"
            git pull -q --rebase && git push -q
          fi
