name: Backtest

on:
  schedule:
    - cron: "17 3 * * 0"     # her pazar 06:17 (İstanbul)
  workflow_dispatch:
    inputs:
      coins:
        description: "Kaç coin (hacme göre)"
        default: "30"
      days:
        description: "Kaç günlük veri"
        default: "365"

permissions:
  contents: write

concurrency:
  group: backtest
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Walk-forward backtest
        run: python -m radar backtest --coins "${{ github.event.inputs.coins || '30' }}" --days "${{ github.event.inputs.days || '365' }}"
      - name: Sonucu kaydet
        run: |
          git config user.name "kripto-radar"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/backtest.json
          if ! git diff --cached --quiet; then
            git commit -qm "📈 backtest sonucu"
            git pull -q --rebase && git push -q
          fi
