name: Tarama

on:
  schedule:
    - cron: "7 * * * *"      # her saat :07'de (saat başı yoğunluğundan kaçmak için)
  workflow_dispatch:          # GitHub uygulamasından "Run workflow" ile elle tetikle

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Kütüphaneleri kur
        run: pip install -r requirements.txt

      - name: Önceki durumu al (defter, ayarlar, dashboard)
        run: bash scripts/site.sh pull

      - name: Tara
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
        run: python -m radar scan --site site

      - name: Dashboard'u yayınla
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/site.sh push "tarama"

      - name: Haftalık karneyi kaydet
        if: success()
        run: |
          if [ -f data/KARNE.md ]; then
            git config user.name "kripto-radar"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/KARNE.md
            if ! git diff --cached --quiet; then
              git commit -qm "📒 haftalık karne"
              git pull -q --rebase && git push -q
            fi
          fi
