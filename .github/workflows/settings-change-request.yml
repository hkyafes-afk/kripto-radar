name: Secure settings change request

on:
  workflow_dispatch:
    inputs:
      change_mode:
        description: "Create a validated settings proposal or a rollback proposal"
        required: true
        type: choice
        options:
          - apply
          - rollback
      parameter_path:
        description: "Allow-listed config parameter (apply mode)"
        required: false
        type: choice
        options:
          - tarama.coin_sayisi
          - tarama.min_hacim_usd
          - risk.risk_yuzde
          - risk.max_spread_bp
          - risk.max_kayma_bp
          - sinyal.guclu_esik
          - sinyal.izle_esik
      new_value:
        description: "New numeric value (apply mode; validated against a fixed safe range)"
        required: false
        type: string
      rollback_id:
        description: "Original audit event ID (rollback mode)"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: secure-settings-change-${{ github.ref }}
  cancel-in-progress: false

concurrency:
  group: settings-change-request
  cancel-in-progress: false

jobs:
  propose:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out protected base branch
        uses: actions/checkout@v5
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install YAML parser
        run: python -m pip install "pyyaml>=6.0"
      - name: Validate and atomically stage one allow-listed setting
        env:
          SETTINGS_MODE: ${{ inputs.change_mode }}
          SETTINGS_PATH: ${{ inputs.parameter_path }}
          SETTINGS_VALUE: ${{ inputs.new_value }}
          SETTINGS_ROLLBACK_ID: ${{ inputs.rollback_id }}
        run: |
          AUDIT_FILE=.settings-change-audit.jsonl
          if [ "$SETTINGS_MODE" = "rollback" ]; then
            if [ -z "$SETTINGS_ROLLBACK_ID" ]; then
              echo "::error::rollback_id is required for rollback mode"
              exit 2
            fi
            python scripts/settings_change.py --file config.yaml --audit-file "$AUDIT_FILE" --rollback-id "$SETTINGS_ROLLBACK_ID"
          else
            if [ -z "$SETTINGS_PATH" ] || [ -z "$SETTINGS_VALUE" ]; then
              echo "::error::parameter_path and new_value are required for apply mode"
              exit 2
            fi
            EXPECTED_SHA=$(sha256sum config.yaml | awk '{print $1}')
            python scripts/settings_change.py --file config.yaml --audit-file "$AUDIT_FILE" --expected-sha256 "$EXPECTED_SHA" --path "$SETTINGS_PATH" --value "$SETTINGS_VALUE"
          fi
      - name: Open a draft pull request for human review
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: settings/${{ inputs.change_mode }}-request-${{ github.run_id }}
          delete-branch: true
          draft: true
          add-paths: |
            config.yaml
            .settings-change-audit.jsonl
          commit-message: "config: propose validated ${{ inputs.parameter_path }} change"
          title: "Config ${{ inputs.change_mode }} proposal: ${{ inputs.parameter_path || inputs.rollback_id }}"
          body: |
            This proposal was generated by the authenticated GitHub Actions workflow.
            - Operation: ${{ inputs.change_mode }}
            - Parameter: ${{ inputs.parameter_path }}
            - Requested value: ${{ inputs.new_value }}
            - Rollback event: ${{ inputs.rollback_id }}

            The change is range/type validated, SHA-256 concurrency guarded, and audit logged.
            A rollback is allowed only while the config still matches the exact post-change hash.

            The change is range/type validated and requires normal PR checks and human review.
            It is not applied automatically. PAPER mode, single-authority settings, credentials,
            exchange endpoints, and live execution are not exposed by this workflow.
