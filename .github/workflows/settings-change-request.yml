name: Secure settings change request

on:
  workflow_dispatch:
    inputs:
      parameter_path:
        description: "Allow-listed config parameter"
        required: true
        type: choice
        options:
          - tarama.coin_sayisi
          - tarama.min_hacim_usd
          - risk.risk_yuzde
          - risk.max_spread_bp
          - risk.max_kayma_bp
          - sinyal.guclu_esik
          - sinyal.izle_esik
      new_value:
        description: "New numeric value (validated against a fixed safe range)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: settings-change-request
  cancel-in-progress: false

jobs:
  propose:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out protected base branch
        uses: actions/checkout@v5
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install YAML parser
        run: python -m pip install "pyyaml>=6.0"
      - name: Validate and atomically stage one allow-listed setting
        run: >-
          python scripts/settings_change.py
          --path "${{ inputs.parameter_path }}"
          --value "${{ inputs.new_value }}"
      - name: Open a draft pull request for human review
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: settings/request-${{ github.run_id }}
          delete-branch: true
          draft: true
          commit-message: "config: propose validated ${{ inputs.parameter_path } change"
          title: "Config proposal: ${{ inputs.parameter_path }}"
          body: |
            This proposal was generated by the authenticated GitHub Actions workflow.
            - Parameter: ${{ inputs.parameter_path }}
            - Requested value: ${{ inputs.new_value }}

            The change is range/type validated and requires normal PR checks and human review.
            It is not applied automatically. PAPER mode, single-authority settings, credentials,
            exchange endpoints, and live execution are not exposed by this workflow.
