name: Full repository tests

on:
  push:
    branches:
      - "feat/**"
    paths:
      - "**.py"
      - "config.yaml"
      - "requirements.txt"
      - ".github/workflows/full-tests.yml"
  pull_request:
    branches:
      - main
    paths:
      - "**.py"
      - "config.yaml"
      - "requirements.txt"
      - ".github/workflows/full-tests.yml"

permissions:
  contents: read

concurrency:
  group: full-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Run complete repository test suite
        run: python -m pytest -q tests
